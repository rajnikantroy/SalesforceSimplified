<!-- Captured from https://login.salesforce.com/ - the real markup the launcher
     suppression has to recognise. My Domain login screens use the same form. -->
<form name="login" method="post" id="login_form" onsubmit="handleLogin(); return false;" action="https://login.salesforce.com/" target="_top" autocomplete="off" novalidate="novalidate">
<input class="input r4 wide mb16 mt8 username" type="email" value="" name="username" id="username" aria-describedby="error" autocomplete="username">
<input class="input r4 wide mb16 mt8 password" type="password" id="password" name="pw" aria-describedby="error"onkeypress="checkCaps(event)" autocomplete="current-password"/>
<input class="button r4 wide primary" type="submit" id="Login" name="Login" value="Log In" />
</form>
