<!DOCTYPE html>
<!-- Author: Rajni Kant Roy(Salesforce Technical Architect) -->
<html lang="en" ng-csp>

<meta charset="utf-8">

<link rel="icon" href="img/simplify.png">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/w3c.css">
</head>
<!--
  The extension's own page, not a panel injected into an org.

  theme-lightning is on the root for the same reason it is on the injected
  roots: every rule in these two stylesheets is scoped to it, so without it
  nothing here is styled at all.

  ng-csp on <html> is not decorative. Extension pages run under Manifest V3's
  content security policy, which forbids unsafe-eval, and AngularJS builds its
  expression compiler with the Function constructor unless told not to.

  Scripts load in the manifest's order, and for the same reason: ss-core needs
  jQuery, everything needs ss-core, and simplified.js bootstraps last because
  Angular can only compile once every directive and service is registered.
-->
<body class="theme-lightning ss-standalone">

<div id="SalesforceSimplified" class="theme-lightning">
  <div ng-controller="MenuAndDetailsCtrl">
    <simplifiedpage></simplifiedpage>
  </div>
</div>
